<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="MAISON NOIR — A minimalist luxury fashion house crafting timeless silhouettes in natural fibers. Shop the collection, explore the lookbook." />
<meta name="keywords" content="fashion, minimalist streetwear, luxury casual, sustainable fashion, lookbook, boutique" />
<meta property="og:title" content="MAISON NOIR — Quiet Luxury, Loud Craft" />
<meta property="og:type" content="website" />
<title>MAISON NOIR — Quiet Luxury, Loud Craft</title>

<!-- ============================================================
     CUSTOMIZATION GUIDE
     ------------------------------------------------------------
     • Brand name: search for "MAISON NOIR" and replace.
     • Colors: edit the :root variables below.
     • Products: edit the PRODUCTS array in the <script> section.
     • Images: swap Unsplash URLs with your own CDN links.
     • Logo: replace the inline SVG in the header with your file.
     ============================================================ -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
/* ---------- Design Tokens ---------- */
:root{
  --bg: #f6f2ec;            /* cream */
  --bg-alt: #ece5da;        /* warm beige */
  --ink: #111111;           /* near-black */
  --ink-soft: #4a4641;      /* warm grey */
  --line: #d9d1c4;
  --accent: #8a6a46;        /* earth tone */
  --white: #ffffff;
  --serif: 'Cormorant Garamond', 'Times New Roman', serif;
  --sans: 'Inter', system-ui, -apple-system, sans-serif;
  --maxw: 1400px;
  --radius: 2px;
  --ease: cubic-bezier(.2,.7,.2,1);
}

/* ---------- Reset ---------- */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  font-family:var(--sans);
  background:var(--bg);
  color:var(--ink);
  font-size:15px;
  line-height:1.6;
  font-weight:300;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font:inherit;color:inherit}
ul{list-style:none}

/* ---------- Typography ---------- */
h1,h2,h3,h4{font-family:var(--serif);font-weight:400;letter-spacing:.01em;line-height:1.1}
h1{font-size:clamp(2.8rem,7vw,6.5rem)}
h2{font-size:clamp(2rem,4.5vw,3.6rem)}
h3{font-size:clamp(1.4rem,2.2vw,1.9rem)}
.eyebrow{
  font-family:var(--sans);
  font-size:11px;
  letter-spacing:.3em;
  text-transform:uppercase;
  font-weight:500;
  color:var(--ink-soft);
}

/* ---------- Layout ---------- */
.container{max-width:var(--maxw);margin:0 auto;padding:0 32px}
section{padding:120px 0}
@media(max-width:720px){section{padding:80px 0}.container{padding:0 20px}}

/* ---------- Buttons ---------- */
.btn{
  display:inline-block;
  padding:16px 34px;
  font-size:11px;
  letter-spacing:.25em;
  text-transform:uppercase;
  font-weight:500;
  border:1px solid var(--ink);
  background:var(--ink);
  color:var(--bg);
  transition:all .4s var(--ease);
  cursor:pointer;
}
.btn:hover{background:transparent;color:var(--ink)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover{background:var(--ink);color:var(--bg)}
.btn.light{background:var(--bg);color:var(--ink);border-color:var(--bg)}
.btn.light:hover{background:transparent;color:var(--bg);border-color:var(--bg)}

/* ---------- Header ---------- */
.header{
  position:fixed;top:0;left:0;right:0;z-index:100;
  padding:22px 0;
  transition:all .4s var(--ease);
  background:transparent;
}
.header.scrolled{
  background:rgba(246,242,236,.92);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  padding:14px 0;
  border-bottom:1px solid var(--line);
}
.header-inner{display:flex;align-items:center;justify-content:space-between;gap:24px}
.logo{font-family:var(--serif);font-size:24px;letter-spacing:.3em;font-weight:500}
.nav{display:flex;gap:36px}
.nav a{
  font-size:12px;letter-spacing:.2em;text-transform:uppercase;
  font-weight:400;position:relative;padding:4px 0;
  transition:color .3s;
}
.nav a::after{
  content:'';position:absolute;left:0;bottom:0;width:0;height:1px;
  background:var(--ink);transition:width .4s var(--ease);
}
.nav a:hover::after{width:100%}
.header-icons{display:flex;gap:20px;align-items:center}
.icon-btn{width:22px;height:22px;display:flex;align-items:center;justify-content:center;position:relative}
.icon-btn svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:1.3}
.cart-count{
  position:absolute;top:-6px;right:-8px;
  background:var(--ink);color:var(--bg);
  font-size:9px;font-weight:500;
  width:16px;height:16px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
}
.menu-toggle{display:none}
@media(max-width:960px){
  .nav{
    position:fixed;top:0;right:-100%;width:80%;max-width:360px;height:100vh;
    background:var(--bg);flex-direction:column;justify-content:center;
    gap:28px;padding:40px;transition:right .5s var(--ease);
    box-shadow:-20px 0 60px rgba(0,0,0,.1);
  }
  .nav.open{right:0}
  .nav a{font-size:16px}
  .menu-toggle{display:flex}
}

/* ---------- Hero ---------- */
.hero{
  position:relative;min-height:100vh;display:flex;align-items:center;
  color:var(--white);overflow:hidden;padding-top:80px;
}
.hero-bg{
  position:absolute;inset:0;
  background-image:url('https://images.unsplash.com/photo-1490481651871-ab68de25d43d?w=1920&q=85');
  background-size:cover;background-position:center;
}
.hero-bg::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(0,0,0,.25) 0%,rgba(0,0,0,.55) 100%);
}
.hero-content{position:relative;z-index:2;max-width:780px}
.hero h1{margin:24px 0 28px;font-weight:300;font-style:italic}
.hero p{
  font-size:clamp(1rem,1.4vw,1.15rem);
  max-width:520px;margin-bottom:44px;
  font-weight:300;opacity:.92;
}
.hero-ctas{display:flex;gap:16px;flex-wrap:wrap}
.hero-meta{
  position:absolute;bottom:40px;left:0;right:0;z-index:2;
  display:flex;justify-content:space-between;align-items:flex-end;
  padding:0 32px;font-size:11px;letter-spacing:.25em;text-transform:uppercase;
}
@media(max-width:720px){.hero-meta{display:none}}

/* ---------- Section headings ---------- */
.section-head{text-align:center;margin-bottom:70px}
.section-head .eyebrow{margin-bottom:18px;display:block}
.section-head h2{margin-bottom:18px;font-style:italic;font-weight:300}
.section-head p{max-width:560px;margin:0 auto;color:var(--ink-soft)}

/* ---------- Collections ---------- */
.collections-grid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:24px;
}
.collection-card{
  position:relative;overflow:hidden;aspect-ratio:3/4;
  cursor:pointer;background:var(--bg-alt);
}
.collection-card:first-child{grid-row:span 2;aspect-ratio:auto}
.collection-card img{
  width:100%;height:100%;object-fit:cover;
  transition:transform 1.2s var(--ease),filter .6s;
}
.collection-card:hover img{transform:scale(1.06);filter:brightness(.85)}
.collection-card .label{
  position:absolute;left:28px;bottom:28px;z-index:2;color:var(--white);
}
.collection-card .label .eyebrow{color:rgba(255,255,255,.8);margin-bottom:8px}
.collection-card .label h3{font-style:italic;font-weight:300}
.collection-card::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(180deg,transparent 40%,rgba(0,0,0,.5) 100%);
}
@media(max-width:900px){.collections-grid{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.collections-grid{grid-template-columns:1fr}.collection-card:first-child{grid-row:auto;aspect-ratio:3/4}}

/* ---------- Shop ---------- */
.shop{background:var(--bg-alt)}
.shop-layout{display:grid;grid-template-columns:240px 1fr;gap:50px}
.filters{position:sticky;top:110px;align-self:start}
.filter-group{margin-bottom:32px;padding-bottom:24px;border-bottom:1px solid var(--line)}
.filter-group:last-child{border-bottom:none}
.filter-group h4{
  font-family:var(--sans);font-size:11px;letter-spacing:.25em;
  text-transform:uppercase;font-weight:500;margin-bottom:16px;
}
.filter-options{display:flex;flex-direction:column;gap:10px}
.filter-options label{
  display:flex;align-items:center;gap:10px;
  font-size:13px;cursor:pointer;color:var(--ink-soft);
  transition:color .2s;
}
.filter-options label:hover{color:var(--ink)}
.filter-options input{accent-color:var(--ink)}
.color-swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatch{
  width:24px;height:24px;border-radius:50%;cursor:pointer;
  border:1px solid var(--line);transition:transform .2s;
}
.swatch:hover{transform:scale(1.15)}
.swatch.active{outline:2px solid var(--ink);outline-offset:2px}

.products{display:grid;grid-template-columns:repeat(3,1fr);gap:30px 24px}
.product{cursor:pointer}
.product-img{
  position:relative;aspect-ratio:3/4;overflow:hidden;
  background:var(--bg);margin-bottom:14px;
}
.product-img img{
  width:100%;height:100%;object-fit:cover;
  transition:transform .8s var(--ease),opacity .4s;
}
.product:hover .product-img img{transform:scale(1.05)}
.quick-view{
  position:absolute;left:50%;bottom:16px;transform:translate(-50%,20px);
  background:var(--bg);color:var(--ink);
  padding:12px 22px;font-size:10px;letter-spacing:.25em;
  text-transform:uppercase;font-weight:500;
  opacity:0;transition:all .4s var(--ease);
}
.product:hover .quick-view{opacity:1;transform:translate(-50%,0)}
.quick-view:hover{background:var(--ink);color:var(--bg)}
.product-info{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.product-name{font-family:var(--serif);font-size:17px;font-weight:400}
.product-price{font-size:13px;color:var(--ink-soft)}
.no-results{grid-column:1/-1;text-align:center;padding:60px 0;color:var(--ink-soft);font-style:italic}

@media(max-width:900px){
  .shop-layout{grid-template-columns:1fr}
  .filters{position:static;display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
  .filter-group{margin-bottom:0;border-bottom:none}
  .products{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:500px){.products{grid-template-columns:1fr 1fr;gap:20px 14px}.product-name{font-size:15px}}

/* ---------- Lookbook (masonry) ---------- */
.lookbook-masonry{column-count:3;column-gap:20px}
.lookbook-item{
  break-inside:avoid;margin-bottom:20px;overflow:hidden;
  position:relative;cursor:pointer;
}
.lookbook-item img{
  width:100%;display:block;transition:transform 1s var(--ease),filter .5s;
}
.lookbook-item:hover img{transform:scale(1.04);filter:brightness(.9)}
.lookbook-item .caption{
  position:absolute;left:0;right:0;bottom:0;padding:20px;
  color:var(--white);opacity:0;transform:translateY(10px);
  transition:all .4s var(--ease);
  background:linear-gradient(transparent,rgba(0,0,0,.6));
}
.lookbook-item:hover .caption{opacity:1;transform:translateY(0)}
.caption .eyebrow{color:rgba(255,255,255,.8);margin-bottom:6px}
@media(max-width:900px){.lookbook-masonry{column-count:2}}
@media(max-width:500px){.lookbook-masonry{column-count:1}}

/* ---------- About ---------- */
.about{background:var(--bg)}
.about-grid{display:grid;grid-template-columns:1fr 1fr;gap:80px;align-items:center}
.about-img{aspect-ratio:4/5;overflow:hidden}
.about-img img{width:100%;height:100%;object-fit:cover}
.about-text .eyebrow{margin-bottom:18px;display:block}
.about-text h2{margin-bottom:28px;font-style:italic;font-weight:300}
.about-text p{margin-bottom:20px;color:var(--ink-soft);max-width:520px}
.about-stats{display:flex;gap:50px;margin-top:40px;padding-top:40px;border-top:1px solid var(--line)}
.stat strong{display:block;font-family:var(--serif);font-size:42px;font-weight:400;margin-bottom:4px}
.stat span{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-soft)}
@media(max-width:900px){.about-grid{grid-template-columns:1fr;gap:50px}.about-stats{gap:30px}}

/* ---------- Testimonials / Press ---------- */
.press{background:var(--bg-alt);padding:80px 0}
.press-logos{
  display:flex;justify-content:space-around;align-items:center;
  flex-wrap:wrap;gap:40px;max-width:1100px;margin:0 auto;
  opacity:.6;
}
.press-logos span{
  font-family:var(--serif);font-size:22px;font-style:italic;
  letter-spacing:.05em;
}
.testimonials{padding:100px 0}
.testi-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:40px}
.testi{padding:30px;background:var(--bg-alt);border:1px solid var(--line)}
.testi blockquote{
  font-family:var(--serif);font-size:19px;font-style:italic;
  line-height:1.5;margin-bottom:20px;font-weight:400;
}
.testi cite{font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-style:normal;color:var(--ink-soft)}
@media(max-width:900px){.testi-grid{grid-template-columns:1fr}}

/* ---------- Instagram ---------- */
.insta{padding:100px 0}
.insta-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.insta-grid a{aspect-ratio:1;overflow:hidden;position:relative}
.insta-grid img{width:100%;height:100%;object-fit:cover;transition:transform .6s var(--ease)}
.insta-grid a:hover img{transform:scale(1.08)}
.insta-grid a::after{
  content:'';position:absolute;inset:0;background:rgba(0,0,0,0);
  transition:background .3s;
}
.insta-grid a:hover::after{background:rgba(0,0,0,.25)}
@media(max-width:720px){.insta-grid{grid-template-columns:repeat(3,1fr)}}

/* ---------- Newsletter ---------- */
.newsletter{
  background:var(--ink);color:var(--bg);text-align:center;
  padding:120px 0;
}
.newsletter h2{font-style:italic;font-weight:300;margin-bottom:20px}
.newsletter p{max-width:480px;margin:0 auto 40px;opacity:.8}
.news-form{
  max-width:520px;margin:0 auto;display:flex;gap:0;
  border-bottom:1px solid rgba(255,255,255,.3);
}
.news-form input{
  flex:1;background:transparent;border:none;outline:none;
  padding:16px 0;color:var(--bg);font-size:14px;
}
.news-form input::placeholder{color:rgba(255,255,255,.5)}
.news-form button{
  padding:16px 24px;font-size:11px;letter-spacing:.25em;
  text-transform:uppercase;font-weight:500;color:var(--bg);
  transition:opacity .3s;
}
.news-form button:hover{opacity:.7}
.news-msg{margin-top:18px;font-size:12px;min-height:18px}
.news-msg.error{color:#e89a8a}
.news-msg.success{color:#b8d4a8}

/* ---------- Footer ---------- */
.footer{background:var(--bg-alt);padding:80px 0 30px;border-top:1px solid var(--line)}
.footer-grid{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:50px;margin-bottom:60px}
.footer h5{
  font-family:var(--sans);font-size:11px;letter-spacing:.25em;
  text-transform:uppercase;font-weight:500;margin-bottom:20px;
}
.footer-col p,.footer-col a{
  font-size:13px;color:var(--ink-soft);display:block;margin-bottom:10px;
  transition:color .2s;
}
.footer-col a:hover{color:var(--ink)}
.footer-brand .logo{margin-bottom:16px;display:block}
.footer-brand p{max-width:320px}
.socials{display:flex;gap:14px;margin-top:20px}
.socials a{
  width:36px;height:36px;border:1px solid var(--line);border-radius:50%;
  display:flex;align-items:center;justify-content:center;margin:0;
  transition:all .3s;
}
.socials a:hover{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.socials svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.5}
.footer-bottom{
  display:flex;justify-content:space-between;align-items:center;
  padding-top:30px;border-top:1px solid var(--line);
  font-size:11px;color:var(--ink-soft);letter-spacing:.1em;
  flex-wrap:wrap;gap:20px;
}
.payment-icons{display:flex;gap:10px;align-items:center}
.payment-icons svg{height:22px;width:auto;opacity:.7}
@media(max-width:900px){.footer-grid{grid-template-columns:1fr 1fr;gap:40px}}
@media(max-width:500px){.footer-grid{grid-template-columns:1fr}}

/* ---------- Cart Drawer ---------- */
.overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.4);
  opacity:0;pointer-events:none;transition:opacity .4s;z-index:200;
}
.overlay.active{opacity:1;pointer-events:auto}
.cart-drawer{
  position:fixed;top:0;right:0;width:440px;max-width:100%;height:100vh;
  background:var(--bg);z-index:201;transform:translateX(100%);
  transition:transform .5s var(--ease);display:flex;flex-direction:column;
}
.cart-drawer.open{transform:translateX(0)}
.cart-head{
  padding:26px 30px;border-bottom:1px solid var(--line);
  display:flex;justify-content:space-between;align-items:center;
}
.cart-head h3{font-size:22px;font-style:italic;font-weight:300}
.cart-close{font-size:22px;line-height:1}
.cart-items{flex:1;overflow-y:auto;padding:20px 30px}
.cart-item{display:grid;grid-template-columns:80px 1fr auto;gap:16px;padding:18px 0;border-bottom:1px solid var(--line)}
.cart-item img{width:80px;height:100px;object-fit:cover}
.cart-item-info h4{font-family:var(--serif);font-size:16px;font-weight:400;margin-bottom:4px}
.cart-item-info p{font-size:12px;color:var(--ink-soft);margin-bottom:8px}
.cart-item-info .qty{display:flex;align-items:center;gap:10px;font-size:12px}
.qty button{
  width:22px;height:22px;border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:12px;
}
.cart-item-price{font-size:13px}
.cart-empty{text-align:center;padding:60px 0;color:var(--ink-soft);font-style:italic}
.cart-foot{padding:26px 30px;border-top:1px solid var(--line)}
.cart-total{display:flex;justify-content:space-between;margin-bottom:20px;font-size:14px}
.cart-total strong{font-family:var(--serif);font-size:22px;font-weight:400}
.cart-foot .btn{width:100%;text-align:center}

/* ---------- Quick View Modal ---------- */
.modal{
  position:fixed;inset:0;z-index:202;display:none;
  align-items:center;justify-content:center;padding:20px;
}
.modal.active{display:flex}
.modal-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.55)}
.modal-content{
  position:relative;background:var(--bg);max-width:900px;width:100%;
  max-height:90vh;overflow:auto;display:grid;grid-template-columns:1fr 1fr;
}
.modal-img{aspect-ratio:3/4;overflow:hidden}
.modal-img img{width:100%;height:100%;object-fit:cover}
.modal-info{padding:50px 40px;display:flex;flex-direction:column;justify-content:center}
.modal-info .eyebrow{margin-bottom:14px;display:block}
.modal-info h2{margin-bottom:10px;font-style:italic;font-weight:300}
.modal-info .price{font-size:18px;margin-bottom:24px;color:var(--ink-soft)}
.modal-info p{margin-bottom:30px;color:var(--ink-soft);font-size:14px}
.modal-sizes{display:flex;gap:8px;margin-bottom:30px;flex-wrap:wrap}
.modal-sizes button{
  width:42px;height:42px;border:1px solid var(--line);
  font-size:12px;transition:all .2s;
}
.modal-sizes button.active,.modal-sizes button:hover{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.modal-close{
  position:absolute;top:16px;right:20px;font-size:26px;z-index:2;
  width:36px;height:36px;display:flex;align-items:center;justify-content:center;
  background:var(--bg);border-radius:50%;
}
@media(max-width:720px){.modal-content{grid-template-columns:1fr}.modal-info{padding:30px 24px}}

/* ---------- Scroll reveal ---------- */
.reveal{opacity:0;transform:translateY(30px);transition:opacity 1s var(--ease),transform 1s var(--ease)}
.reveal.visible{opacity:1;transform:translateY(0)}

/* ---------- Utilities ---------- */
::selection{background:var(--ink);color:var(--bg)}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--line)}
::-webkit-scrollbar-thumb:hover{background:var(--ink-soft)}
</style>
</head>
<body>

<!-- ===================== HEADER ===================== -->
<header class="header" id="header">
  <div class="container header-inner">
    <a href="#home" class="logo">MAISON NOIR</a>
    <nav class="nav" id="nav">
      <a href="#home">Home</a>
      <a href="#shop">Shop</a>
      <a href="#collections">Collections</a>
      <a href="#lookbook">L
